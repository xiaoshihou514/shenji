##############################
# Data
##############################
data_dir: ./data
shard_pattern: "shard_*.npz"
num_workers: 8
max_shards: 10   # uncomment to limit total shards considered
val_shards: 1      # last N shards reserved for validation (not used in training)

##############################
# Model  (medium ~85M params)
# For a fast experiment, use the small variant:
#   d_model: 256 | nhead: 8 | num_layers: 6 | dim_feedforward: 1024
##############################
d_model: 768
nhead: 12
num_layers: 12
dim_feedforward: 3072
dropout: 0.1

##############################
# Optimiser
##############################
lr: 1.5e-4          # reduced from 3e-4 for fp16 stability
min_lr: 1.0e-5
weight_decay: 1.0e-4
betas: [0.9, 0.95]
clip_grad_norm: 1.0
warmup_steps: 5000  # increased from 2000 for smoother ramp-up

##############################
# Training
##############################
batch_size: 256
grad_accum: 4           # effective batch = batch_size * grad_accum = 1024
epochs: 20
label_smoothing: 0.1    # reduces overconfident predictions; helps generalisation

##############################
# Logging / checkpointing
##############################
log_every: 50           # optimiser steps
eval_every: 2000        # optimiser steps
save_dir: ./checkpoints

# resume: ./checkpoints/step_050000.pt   # uncomment to resume
