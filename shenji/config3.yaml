##############################
# Data
##############################
data_dir: ./data
shard_pattern: "shard_*.npz"
num_workers: 8
max_shards: 50   # uncomment to limit training to the first N shards

##############################
# Model  (medium ~85M params)
# For a fast experiment, use the small variant:
#   d_model: 256 | nhead: 8 | num_layers: 6 | dim_feedforward: 1024
##############################
d_model: 768
nhead: 12
num_layers: 12
dim_feedforward: 3072
dropout: 0.1

##############################
# Optimiser
##############################
lr: 3.0e-4
min_lr: 1.0e-5
weight_decay: 1.0e-4
betas: [0.9, 0.95]
clip_grad_norm: 1.0
warmup_steps: 2000

##############################
# Training
##############################
batch_size: 256
grad_accum: 4           # effective batch = batch_size * grad_accum = 1024
epochs: 20

##############################
# Logging / checkpointing
##############################
log_every: 50           # optimiser steps
eval_every: 2000        # optimiser steps
save_dir: ./checkpoints_big

resume: ./checkpoints_big/epoch_007_step_0334957.pt
