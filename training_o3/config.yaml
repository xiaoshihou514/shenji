##############################
# Data
##############################
data_dir: data
shard_pattern: shard_*.npz
batch_size: 256
num_workers: 8
max_games: null # set an int for quick experiments

##############################
# Model
##############################
d_model: 256
nhead: 8
num_layers: 12
dim_feedforward: 1024
dropout: 0.1
max_len: 65 # 64 squares + CLS

##############################
# Optimizer
##############################
lr: 0.0003
weight_decay: 0.0001
betas: [ 0.9, 0.95 ]
clip_grad_norm: 1.0

##############################
# Training
##############################
epochs: 10
log_every: 100
eval_every: 2000
save_dir: checkpoints
